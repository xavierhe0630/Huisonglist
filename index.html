<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ry.灰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242424;
    --plum:#5c5c5c;
    --plum-deep:#1c1c1c;
    --cream:#f7f7f7;
    --blush:#dcdcdc;
    --blush-deep:#3a3a3a;
    --gold:#8c8c8c;
    --mint:#d4d4d4;
    --line: rgba(255,255,255,0.4);
    --shadow: 0 8px 32px rgba(0,0,0,0.16);
    --radius: 20px;
    --glass: rgba(255,255,255,0.5);
    --glass-strong: rgba(255,255,255,0.68);
    --glass-border: rgba(255,255,255,0.55);
    --display: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
    --body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- fixed background (stays put while page scrolls) ---------- */
  #bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat:no-repeat;
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(0,0,0,0.18);
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 18px 60px;
    position:relative;
    z-index:1;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    color:var(--cream);
    padding:10px 0 22px;
  }
  .hero h1{
    font-family:var(--display);
    font-weight:600;
    font-size:2.2rem;
    margin:0 0 8px;
    letter-spacing:4px;
    text-shadow:0 2px 14px rgba(0,0,0,0.45);
  }
  .hero p{
    margin:0;
    font-size:0.9rem;
    font-weight:300;
    color:rgba(255,255,255,0.88);
    line-height:1.7;
    letter-spacing:0.5px;
  }
  .count-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:16px;
    background:rgba(255,255,255,0.16);
    border:1px solid var(--line);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:7px 18px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:300;
    color:var(--cream);
  }
  .count-pill b{ font-family:var(--display); font-weight:600; font-size:1rem; color:#fff;}

  /* ---------- card shell (frosted glass) ---------- */
  .card{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--display);
    font-weight:600;
    font-size:1.1rem;
    margin:0 0 14px;
    letter-spacing:1px;
    color:var(--plum-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* ---------- search ---------- */
  .search-box{
    display:flex;
    gap:8px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:16px;
    padding:6px 6px 6px 14px;
    align-items:center;
  }
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:1rem;
    font-family:var(--body);
    font-weight:300;
    background:transparent;
    padding:8px 0;
    color:var(--ink);
  }
  .search-box input::placeholder{ color:rgba(36,36,36,0.45); }
  .clear-btn{
    border:none;background:rgba(255,255,255,0.7);color:var(--plum);
    width:30px;height:30px;border-radius:50%;
    font-size:0.95rem; cursor:pointer; flex-shrink:0;
    display:none;align-items:center;justify-content:center;
  }

  .chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .chip{
    border:1px solid rgba(36,36,36,0.16);
    background:rgba(255,255,255,0.35);
    color:var(--ink);
    padding:6px 14px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--plum-deep);
    border-color:var(--plum-deep);
    color:#fff;
    font-weight:500;
  }

  /* ---------- random ---------- */
  .random-btn{
    width:100%;
    border:none;
    background:var(--plum-deep);
    color:#fff;
    font-family:var(--display);
    font-weight:500;
    font-size:1.05rem;
    letter-spacing:3px;
    padding:15px;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease;
  }
  .random-btn:active{ transform:scale(0.97); }
  .random-result{
    margin-top:16px;
    text-align:center;
    padding:18px;
    border-radius:16px;
    background:rgba(255,255,255,0.45);
    border:1px dashed rgba(36,36,36,0.25);
    display:none;
  }
  .random-result.show{
    display:block;
    animation:pop .35s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .random-result .rname{
    font-family:var(--display);
    font-weight:600;
    font-size:1.4rem;
    color:var(--plum-deep);
  }
  .random-result .rmeta{
    margin-top:6px;
    font-size:0.85rem;
    font-weight:300;
    color:#4a4a4a;
  }
  .random-result .tag{
    display:inline-block;
    margin:8px 3px 0;
    padding:3px 12px;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:300;
    border:1px solid rgba(36,36,36,0.2);
    color:#333;
  }

  /* ---------- song list ---------- */
  .song-list{
    list-style:none;
    margin:16px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:520px;
    overflow-y:auto;
    padding-right:2px;
  }
  .song-item{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .song-item:active{ background:rgba(255,255,255,0.78); transform:scale(0.985); }
  .song-item .info{ min-width:0; flex:1; }
  .song-item .sname{
    font-weight:700;
    font-size:1rem;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-item .sartist{
    font-size:0.76rem;
    font-weight:300;
    color:#525252;
    margin-top:2px;
  }
  .song-item .stags{
    flex-shrink:0;
    text-align:right;
  }
  .song-item .stags span{
    display:inline-block;
    font-size:0.66rem;
    font-weight:300;
    padding:2px 9px;
    border-radius:999px;
    margin-left:4px;
    border:1px solid rgba(36,36,36,0.18);
    color:#333;
    white-space:nowrap;
  }
  .song-item .stags .lang{ border-style:dashed; }

  .empty-msg{
    text-align:center;
    padding:36px 10px;
    color:#4a4a4a;
    font-size:1rem;
    font-weight:300;
  }

  .result-count{
    font-size:0.76rem;
    font-weight:300;
    color:#333;
    margin-top:10px;
  }

  /* ---------- admin edit button (visible only in admin mode) ---------- */
  .edit-btn{
    border:none;
    background:rgba(255,255,255,0.6);
    color:#333;
    width:26px;height:26px;
    border-radius:50%;
    font-size:0.8rem;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    margin-right:6px;
  }
  .admin-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.4);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:12px;
    padding:8px 12px;
    font-size:0.76rem;
    font-weight:300;
    color:#333;
    margin-bottom:14px;
  }
  .admin-bar.show{ display:flex; }
  .admin-bar button{
    border:none;background:transparent;color:#333;
    text-decoration:underline;cursor:pointer;font-size:0.76rem;
  }

  /* ---------- add song form ---------- */
  details.add-panel{ }
  details.add-panel summary{
    cursor:pointer;
    list-style:none;
    font-family:var(--display);
    font-size:1.15rem;
    color:var(--plum-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  details.add-panel summary::-webkit-details-marker{ display:none; }
  details.add-panel summary::after{
    content:"▾";
    margin-left:auto;
    transition:transform .2s;
    color:var(--blush-deep);
  }
  details.add-panel[open] summary::after{ transform:rotate(180deg); }

  .form-grid{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .form-grid label{
    font-size:0.8rem;
    color:#6e6e6e;
    display:block;
    margin-bottom:5px;
  }
  .form-grid input, .form-grid select{
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(36,36,36,0.15);
    font-size:0.95rem;
    font-family:var(--body);
    outline:none;
    background:rgba(255,255,255,0.55);
    color:var(--ink);
  }
  .form-grid input:focus, .form-grid select:focus{
    border-color:var(--blush-deep);
  }
  .submit-btn{
    border:none;
    background:var(--plum-deep);
    color:#fff;
    padding:12px;
    border-radius:12px;
    font-family:var(--display);
    font-size:1rem;
    letter-spacing:1px;
    cursor:pointer;
  }
  .form-msg{
    font-size:0.82rem;
    color:#3a3a3a;
    font-weight:600;
    display:none;
  }
  .form-msg.show{ display:block; }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.62);
    font-size:0.72rem;
    line-height:1.9;
    margin-top:10px;
  }
  footer a{ color:var(--gold); text-decoration:none; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#cfcfcf; border-radius:10px; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--plum-deep);
    color:var(--cream);
    padding:10px 20px;
    border-radius:999px;
    font-size:0.85rem;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="bg"></div>

<div class="wrap">

  <div class="hero">
    <h1>Ry.灰</h1>
    <p>能和你并排走的话<br>下雨也是好天气</p>
    <div class="count-pill">当前收录 <b id="songCount">0</b> 首歌曲</div>
  </div>

  <!-- 搜索 -->
  <div class="card">
    <h2>找歌</h2>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索歌名或歌手…" autocomplete="off">
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
    <div class="chips" id="styleChips"></div>

    <ul class="song-list" id="songList"></ul>
    <div class="result-count" id="resultCount"></div>
  </div>

  <!-- 随机 -->
  <div class="card">
    <h2>随机</h2>
    <button class="random-btn" id="randomBtn">随机抽一首</button>
    <div class="random-result" id="randomResult"></div>
  </div>

  <!-- 管理员专属：添加/编辑歌曲 -->
  <div class="card" id="adminCard" style="display:none;">
    <div class="admin-bar show">
      <span>管理模式已开启</span>
      <button id="adminLogoutBtn">退出</button>
    </div>
    <details class="add-panel">
      <summary>学会新歌了？加进来</summary>
      <div class="form-grid">
        <div>
          <label>歌名 *</label>
          <input id="inName" type="text" placeholder="例如：小幸运">
        </div>
        <div>
          <label>原唱歌手</label>
          <input id="inArtist" type="text" placeholder="例如：田馥甄">
        </div>
        <div>
          <label>风格</label>
          <select id="inStyle">
            <option value="流行">流行</option>
            <option value="旋律">旋律</option>
            <option value="古风">古风</option>
            <option value="粤语">粤语</option>
            <option value="歪歌">歪歌</option>
            <option value="甜歌">甜歌</option>
            <option value="rnb">R&B</option>
            <option value="__custom">其他（自己填）</option>
          </select>
          <input id="inStyleCustom" type="text" placeholder="填写自定义风格" style="display:none;margin-top:8px;">
        </div>
        <div>
          <label>语言</label>
          <select id="inLang">
            <option value="中文">中文</option>
            <option value="粤语">粤语</option>
            <option value="英语">英语</option>
            <option value="日语">日语</option>
            <option value="__custom">其他（自己填）</option>
          </select>
          <input id="inLangCustom" type="text" placeholder="填写自定义语言" style="display:none;margin-top:8px;">
        </div>
        <button class="submit-btn" id="addBtn">添加到歌单</button>
        <div class="form-msg" id="formMsg">已加入歌单啦</div>
      </div>
    </details>
  </div>

  <footer>
    huisonglist.live · Ry.灰的歌单
  </footer>

</div>

<div class="toast" id="toast"></div>

const STORAGE_KEY = 'huisong_custom_songs';

function loadCustomSongs(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCustomSongs(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let customSongs = loadCustomSongs();

const OVERRIDES_KEY = 'huisong_overrides';
function loadOverrides(){
  try{
    const raw = localStorage.getItem(OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveOverrides(obj){
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(obj));
}
let overrides = loadOverrides();

// ---------- 管理模式 ----------
// 访问网址后面加上 #admin 并输入密码即可开启管理模式，可在此处修改密码
const ADMIN_KEY = 'ryhui2025';
const ADMIN_FLAG = 'ry_is_admin';
let isAdmin = localStorage.getItem(ADMIN_FLAG) === '1';

function tryUnlockAdmin(){
  if(location.hash === '#admin'){
    const input = prompt('请输入管理密码');
    if(input === ADMIN_KEY){
      localStorage.setItem(ADMIN_FLAG, '1');
      isAdmin = true;
    }
    history.replaceState(null, '', location.pathname + location.search);
  }
}
tryUnlockAdmin();

function editSong(s){
  const newArtist = prompt(`修改「${s.name}」的原唱歌手：`, s.artist || '');
  if(newArtist === null) return;
  if(s._idx !== undefined){
    overrides[s._idx] = Object.assign({}, overrides[s._idx], { artist: newArtist.trim() });
    saveOverrides(overrides);
  } else if(s._cidx !== undefined){
    customSongs[s._cidx].artist = newArtist.trim();
    saveCustomSongs(customSongs);
  }
  renderList();
  showToast('已更新歌手信息');
}

function allSongs(){
  const builtin = BUILTIN_SONGS.map((s, i) => {
    const ov = overrides[i];
    return ov ? Object.assign({}, s, ov, { _idx: i }) : Object.assign({}, s, { _idx: i });
  });
  const custom = customSongs.map((s, i) => Object.assign({}, s, { _cidx: i }));
  return builtin.concat(custom);
}

let activeStyle = '全部';
let searchTerm = '';

const songListEl = document.getElementById('songList');
const resultCountEl = document.getElementById('resultCount');
const chipsEl = document.getElementById('styleChips');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

function getStyleList(){
  const set = new Set();
  allSongs().forEach(s => { if(s.style) set.add(s.style); });
  return ['全部', ...Array.from(set)];
}

function renderChips(){
  const styles = getStyleList();
  chipsEl.innerHTML = '';
  styles.forEach(st => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (st === activeStyle ? ' active' : '');
    chip.textContent = st;
    chip.onclick = () => { activeStyle = st; renderChips(); renderList(); };
    chipsEl.appendChild(chip);
  });
}

function matches(song, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  return (song.name && song.name.toLowerCase().includes(t)) ||
         (song.artist && song.artist.toLowerCase().includes(t));
}

function renderList(){
  const term = searchTerm;
  let list = allSongs().filter(s => matches(s, term));
  if(activeStyle !== '全部'){
    list = list.filter(s => s.style === activeStyle);
  }

  songListEl.innerHTML = '';

  const showList = list;

  if(list.length === 0){
    songListEl.innerHTML = '<li class="empty-msg">暂时还没有这首歌</li>';
    resultCountEl.textContent = '';
    return;
  }

  showList.forEach(s => {
    const li = document.createElement('li');
    li.className = 'song-item';
    li.innerHTML = `
      ${isAdmin ? '<button class="edit-btn" type="button">✎</button>' : ''}
      <div class="info">
        <div class="sname">${escapeHtml(s.name)}</div>
        <div class="sartist">${escapeHtml(s.artist || '歌手待补充')}</div>
      </div>
      <div class="stags">
        <span>${escapeHtml(s.style || '未分类')}</span>
        <span class="lang">${escapeHtml(s.language || '中文')}</span>
      </div>
    `;
    li.addEventListener('click', () => copySongName(s.name));
    if(isAdmin){
      const editBtn = li.querySelector('.edit-btn');
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        editSong(s);
      });
    }
    songListEl.appendChild(li);
  });

  resultCountEl.textContent = `共 ${list.length} 首`;
}

// ---------- 点击复制歌名 ----------
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function copySongName(name){
  const done = () => showToast(`已复制「${name}」`);
  const fail = () => showToast('复制失败，长按手动复制吧～');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(name).then(done).catch(fail);
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = name;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ fail(); }
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  clearBtn.style.display = searchTerm ? 'flex' : 'none';
  renderList();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  clearBtn.style.display = 'none';
  renderList();
});

// ---------- 随机 ----------
const randomBtn = document.getElementById('randomBtn');
const randomResult = document.getElementById('randomResult');
randomBtn.addEventListener('click', () => {
  const list = allSongs();
  if(list.length === 0) return;
  const song = list[Math.floor(Math.random() * list.length)];
  randomResult.classList.remove('show');
  void randomResult.offsetWidth; // restart animation
  randomResult.innerHTML = `
    <div class="rname">${escapeHtml(song.name)}</div>
    <div class="rmeta">${escapeHtml(song.artist || '歌手待补充')}</div>
    <div>
      <span class="tag">${escapeHtml(song.style || '未分类')}</span>
      <span class="tag">${escapeHtml(song.language || '中文')}</span>
    </div>
  `;
  randomResult.style.cursor = 'pointer';
  randomResult.onclick = () => copySongName(song.name);
  randomResult.classList.add('show');
});

const inStyle = document.getElementById('inStyle');
const inStyleCustom = document.getElementById('inStyleCustom');
const inLang = document.getElementById('inLang');
const inLangCustom = document.getElementById('inLangCustom');

inStyle.addEventListener('change', () => {
  inStyleCustom.style.display = inStyle.value === '__custom' ? 'block' : 'none';
});
inLang.addEventListener('change', () => {
  inLangCustom.style.display = inLang.value === '__custom' ? 'block' : 'none';
});

document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('inName').value.trim();
  const artist = document.getElementById('inArtist').value.trim();
  const style = inStyle.value === '__custom' ? inStyleCustom.value.trim() : inStyle.value;
  const language = inLang.value === '__custom' ? inLangCustom.value.trim() : inLang.value;
  const msg = document.getElementById('formMsg');

  if(!name){
    msg.textContent = '歌名不能是空的哦～';
    msg.style.color = '#333333';
    msg.classList.add('show');
    return;
  }

  customSongs.push({ name, artist, style: style || '未分类', language: language || '中文' });
  saveCustomSongs(customSongs);

  document.getElementById('inName').value = '';
  document.getElementById('inArtist').value = '';
  inStyle.value = '流行';
  inLang.value = '中文';
  inStyleCustom.style.display = 'none';
  inLangCustom.style.display = 'none';
  inStyleCustom.value = '';
  inLangCustom.value = '';

  msg.textContent = '已加入歌单啦';
  msg.style.color = '#333333';
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2200);

  renderChips();
  renderList();
  document.getElementById('songCount').textContent = allSongs().length;
});

document.getElementById('adminCard').style.display = isAdmin ? 'block' : 'none';
document.getElementById('adminLogoutBtn').addEventListener('click', () => {
  localStorage.removeItem(ADMIN_FLAG);
  isAdmin = false;
  document.getElementById('adminCard').style.display = 'none';
  renderList();
  showToast('已退出管理模式');
});

document.getElementById('songCount').textContent = allSongs().length;
renderChips();
renderList();
</script>
