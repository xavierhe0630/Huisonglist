<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ry.灰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#242424;
    --plum:#5c5c5c;
    --plum-deep:#1c1c1c;
    --cream:#f7f7f7;
    --blush:#dcdcdc;
    --blush-deep:#3a3a3a;
    --gold:#8c8c8c;
    --mint:#d4d4d4;
    --line: rgba(255,255,255,0.4);
    --shadow: 0 8px 32px rgba(0,0,0,0.16);
    --radius: 20px;
    --glass: rgba(255,255,255,0.5);
    --glass-strong: rgba(255,255,255,0.68);
    --glass-border: rgba(255,255,255,0.55);
    --display: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
    --body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- fixed background (stays put while page scrolls) ---------- */
  #bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat:no-repeat;
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(0,0,0,0.18);
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 18px 60px;
    position:relative;
    z-index:1;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    color:var(--cream);
    padding:10px 0 22px;
  }
  .hero .avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.75);
    box-shadow:0 6px 22px rgba(0,0,0,0.45);
    margin-bottom:14px;
  }
  .hero h1{
    font-family:var(--display);
    font-weight:600;
    font-size:2.2rem;
    margin:0 0 12px;
    letter-spacing:4px;
    text-shadow:0 2px 14px rgba(0,0,0,0.45);
  }
  .hero p{
    display:inline-block;
    margin:0;
    font-size:0.92rem;
    font-weight:500;
    color:#fff;
    line-height:1.8;
    letter-spacing:0.5px;
    padding:9px 20px;
    background:rgba(0,0,0,0.32);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:14px;
    text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }
  .count-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:16px;
    background:rgba(255,255,255,0.16);
    border:1px solid var(--line);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:7px 18px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:300;
    color:var(--cream);
  }
  .count-pill b{ font-family:var(--display); font-weight:600; font-size:1rem; color:#fff;}

  /* ---------- card shell (frosted glass) ---------- */
  .card{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:var(--display);
    font-weight:600;
    font-size:1.1rem;
    margin:0 0 14px;
    letter-spacing:1px;
    color:var(--plum-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* ---------- search ---------- */
  .search-box{
    display:flex;
    gap:8px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:16px;
    padding:6px 6px 6px 14px;
    align-items:center;
  }
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:1rem;
    font-family:var(--body);
    font-weight:300;
    background:transparent;
    padding:8px 0;
    color:var(--ink);
  }
  .search-box input::placeholder{ color:rgba(36,36,36,0.45); }
  .clear-btn{
    border:none;background:rgba(255,255,255,0.7);color:var(--plum);
    width:30px;height:30px;border-radius:50%;
    font-size:0.95rem; cursor:pointer; flex-shrink:0;
    display:none;align-items:center;justify-content:center;
  }

  .chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .chip{
    border:1px solid rgba(36,36,36,0.16);
    background:rgba(255,255,255,0.35);
    color:var(--ink);
    padding:6px 14px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:300;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--plum-deep);
    border-color:var(--plum-deep);
    color:#fff;
    font-weight:500;
  }

  /* ---------- random ---------- */
  .random-btn{
    width:100%;
    border:none;
    background:var(--plum-deep);
    color:#fff;
    font-family:var(--display);
    font-weight:500;
    font-size:1.05rem;
    letter-spacing:3px;
    padding:15px;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease;
  }
  .random-btn:active{ transform:scale(0.97); }
  .random-result{
    margin-top:16px;
    text-align:center;
    padding:18px;
    border-radius:16px;
    background:rgba(255,255,255,0.45);
    border:1px dashed rgba(36,36,36,0.25);
    display:none;
  }
  .random-result.show{
    display:block;
    animation:pop .35s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .random-result .rname{
    font-family:var(--display);
    font-weight:600;
    font-size:1.4rem;
    color:var(--plum-deep);
  }
  .random-result .rmeta{
    margin-top:6px;
    font-size:0.85rem;
    font-weight:300;
    color:#4a4a4a;
  }
  .random-result .tag{
    display:inline-block;
    margin:8px 3px 0;
    padding:3px 12px;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:400;
    border:1px solid transparent;
  }

  /* ---------- song list ---------- */
  .song-list{
    list-style:none;
    margin:16px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:520px;
    overflow-y:auto;
    padding-right:2px;
  }
  .song-item{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .song-item:active{ background:rgba(255,255,255,0.78); transform:scale(0.985); }
  .song-item .info{ min-width:0; flex:1; }
  .song-item .sname{
    font-weight:700;
    font-size:1rem;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-item .sartist{
    font-size:0.76rem;
    font-weight:300;
    color:#525252;
    margin-top:2px;
  }
  .song-item .stags{
    flex-shrink:0;
    text-align:right;
  }
  .song-item .stags span{
    display:inline-block;
    font-size:0.66rem;
    font-weight:400;
    padding:2px 9px;
    border-radius:999px;
    margin-left:4px;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .song-item .stags .style2tag{ border-style:dashed; }

  /* ---------- 风格配色 ---------- */
  .style-pop{ background:rgba(74,125,201,0.16); color:#2d5da8; border-color:rgba(74,125,201,0.35); }
  .style-melody{ background:rgba(147,112,219,0.18); color:#6a3fb5; border-color:rgba(147,112,219,0.35); }
  .style-ancient{ background:rgba(196,149,64,0.20); color:#8a6220; border-color:rgba(196,149,64,0.4); }
  .style-canto{ background:rgba(56,150,140,0.18); color:#1f7268; border-color:rgba(56,150,140,0.35); }
  .style-novelty{ background:rgba(230,126,34,0.20); color:#b1580a; border-color:rgba(230,126,34,0.4); }
  .style-sweet{ background:rgba(219,112,157,0.18); color:#b23d6e; border-color:rgba(219,112,157,0.35); }
  .style-rap{ background:rgba(50,50,50,0.14); color:#2a2a2a; border-color:rgba(50,50,50,0.3); }
  .style-other{ background:rgba(120,120,120,0.14); color:#555; border-color:rgba(120,120,120,0.3); }

  .chip-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .chip-dot.style-pop{ background:#2d5da8; }
  .chip-dot.style-melody{ background:#6a3fb5; }
  .chip-dot.style-ancient{ background:#8a6220; }
  .chip-dot.style-canto{ background:#1f7268; }
  .chip-dot.style-novelty{ background:#b1580a; }
  .chip-dot.style-sweet{ background:#b23d6e; }
  .chip-dot.style-rap{ background:#2a2a2a; }
  .chip-dot.style-other{ background:#555; }

  .empty-msg{
    text-align:center;
    padding:36px 10px;
    color:#4a4a4a;
    font-size:1rem;
    font-weight:300;
  }

  .result-count{
    font-size:0.76rem;
    font-weight:300;
    color:#333;
    margin-top:10px;
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.62);
    font-size:0.72rem;
    line-height:1.9;
    margin-top:10px;
  }
  footer a{ color:var(--gold); text-decoration:none; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#cfcfcf; border-radius:10px; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--plum-deep);
    color:var(--cream);
    padding:10px 20px;
    border-radius:999px;
    font-size:0.85rem;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>

// ---------- 按歌名拼音顺序排序（辅以字数长短） ----------
let pinyinCollator = null;
try{
  pinyinCollator = new Intl.Collator('zh-Hans-CN-u-co-pinyin');
}catch(e){ pinyinCollator = null; }

function sortSongs(list){
  const arr = list.slice();
  arr.sort((a, b) => {
    // 歪歌永远排在最后
    const aBottom = a.style === '歪歌' ? 1 : 0;
    const bBottom = b.style === '歪歌' ? 1 : 0;
    if(aBottom !== bBottom) return aBottom - bBottom;

    // 按字数长短排列（一个字、两个字...）
    const lenDiff = a.name.length - b.name.length;
    if(lenDiff !== 0) return lenDiff;

    // 字数相同时按拼音（字母）顺序排列
    if(pinyinCollator){
      const c = pinyinCollator.compare(a.name, b.name);
      if(c !== 0) return c;
    }
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  return arr;
}

let activeStyle = '全部';
let searchTerm = '';

function styleColorClass(styleName){
  const map = {
    '流行': 'style-pop',
    '旋律': 'style-melody',
    '古风': 'style-ancient',
    '粤语': 'style-canto',
    '歪歌': 'style-novelty',
    '甜歌': 'style-sweet',
    '说唱': 'style-rap'
  };
  return map[styleName] || 'style-other';
}

const songListEl = document.getElementById('songList');
const resultCountEl = document.getElementById('resultCount');
const chipsEl = document.getElementById('styleChips');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

function getStyleList(){
  const set = new Set();
  allSongs().forEach(s => {
    if(s.style) set.add(s.style);
    if(s.style2){
      s.style2.split('/').forEach(t => { if(t.trim()) set.add(t.trim()); });
    }
  });
  return ['全部', ...Array.from(set)];
}

function renderChips(){
  const styles = getStyleList();
  chipsEl.innerHTML = '';
  styles.forEach(st => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (st === activeStyle ? ' active' : '');
    if(st === '全部'){
      chip.textContent = st;
    } else {
      const dot = document.createElement('span');
      dot.className = 'chip-dot ' + styleColorClass(st);
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(st));
    }
    chip.onclick = () => { activeStyle = st; renderChips(); renderList(); };
    chipsEl.appendChild(chip);
  });
}

function matches(song, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  return (song.name && song.name.toLowerCase().includes(t)) ||
         (song.artist && song.artist.toLowerCase().includes(t));
}

function renderList(){
  const term = searchTerm;
  let list = allSongs().filter(s => matches(s, term));
  if(activeStyle !== '全部'){
    list = list.filter(s =>
      s.style === activeStyle ||
      (s.style2 && s.style2.split('/').map(t => t.trim()).includes(activeStyle))
    );
  }

  songListEl.innerHTML = '';
  songListEl.scrollTop = 0;

  const showList = sortSongs(list);

  if(list.length === 0){
    songListEl.innerHTML = '<li class="empty-msg">暂时还没有这首歌</li>';
    resultCountEl.textContent = '';
    return;
  }

  showList.forEach(s => {
    const li = document.createElement('li');
    li.className = 'song-item';
    li.innerHTML = `
      <div class="info">
        <div class="sname">${escapeHtml(s.name)}</div>
        <div class="sartist">${escapeHtml(s.artist || '歌手待补充')}</div>
      </div>
      <div class="stags">
        <span class="${styleColorClass(s.style)}">${escapeHtml(s.style || '未分类')}</span>
        ${s.style2 ? `<span class="style2tag ${styleColorClass(s.style2)}">${escapeHtml(s.style2)}</span>` : ''}
      </div>
    `;
    li.addEventListener('click', () => copySongName(s.name));
    songListEl.appendChild(li);
  });

  resultCountEl.textContent = `共 ${list.length} 首`;
}

  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function copySongName(name){
  const done = () => showToast(`已复制「${name}」`);
  const fail = () => showToast('复制失败，长按手动复制吧～');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(name).then(done).catch(fail);
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = name;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ fail(); }
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  clearBtn.style.display = searchTerm ? 'flex' : 'none';
  renderList();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  clearBtn.style.display = 'none';
  renderList();
});

// ---------- 随机 ----------
const randomBtn = document.getElementById('randomBtn');
const randomResult = document.getElementById('randomResult');
randomBtn.addEventListener('click', () => {
  const list = allSongs();
  if(list.length === 0) return;
  const song = list[Math.floor(Math.random() * list.length)];
  randomResult.classList.remove('show');
  void randomResult.offsetWidth; // restart animation
  randomResult.innerHTML = `
    <div class="rname">${escapeHtml(song.name)}</div>
    <div class="rmeta">${escapeHtml(song.artist || '歌手待补充')}</div>
    <div>
      <span class="tag ${styleColorClass(song.style)}">${escapeHtml(song.style || '未分类')}</span>
      ${song.style2 ? `<span class="tag ${styleColorClass(song.style2)}">${escapeHtml(song.style2)}</span>` : ''}
    </div>
  `;
  randomResult.style.cursor = 'pointer';
  randomResult.onclick = () => copySongName(song.name);
  randomResult.classList.add('show');
});

// ---------- 从 songs.xlsx 自动加载歌单（可选，找不到就用内置数据） ----------
async function loadSongsFromExcel(){
  try{
    const resp = await fetch('songs.xlsx', { cache: 'no-store' });
    if(!resp.ok) return false;
    const buf = await resp.arrayBuffer();
    if(typeof XLSX === 'undefined') return false;
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if(!rows || rows.length === 0) return false;
    const parsed = rows.map(r => ({
      name: String(r['歌名'] || '').trim(),
      artist: String(r['歌手'] || '').trim(),
      style: String(r['风格'] || '').trim(),
      style2: String(r['风格2'] || '').trim()
    })).filter(s => s.name && (s.artist || s.style || s.style2))
      .map(s => ({ ...s, style: s.style || '未分类' }));
    if(parsed.length === 0) return false;
    BUILTIN_SONGS = parsed;
    return true;
  }catch(e){
    return false;
  }
}

// ---------- 初始化 ----------
(async function init(){
  await loadSongsFromExcel();
  document.getElementById('songCount').textContent = allSongs().length;
  renderChips();
  renderList();
})();
</script>
